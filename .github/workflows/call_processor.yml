# .github/workflows/main.yml

name: CX Insights - Process Calls and Update Index

on:
  schedule:
    - cron: '*/15 * * * *'  # Run every 15 minutes
  workflow_dispatch:      # Allow manual triggering

jobs:
  process-and-index:
    runs-on: ubuntu-latest
    
    # Define all environment variables/secrets needed by the scripts at the job level
    env:
      # Secrets for main.py (call processing)
      EXOTEL_ACCOUNT_SID: ${{ secrets.EXOTEL_ACCOUNT_SID }}
      EXOTEL_API_KEY: ${{ secrets.EXOTEL_API_KEY }}
      EXOTEL_API_TOKEN: ${{ secrets.EXOTEL_API_TOKEN }}
      ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # Used by main.py
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }} # Used by main.py
      
      # Secrets for index_data.py (Pinecone indexing)
      # Note: These may be the same as above, adjust secret names if needed
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      OPENAI_API_KEY_CHAT: ${{ secrets.OPENAI_API_KEY_CHAT }}
      GOOGLE_CREDENTIALS_JSON_CHAT: ${{ secrets.GOOGLE_CREDENTIALS_JSON_CHAT }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      PINECONE_ENVIRONMENT: ${{ secrets.PINECONE_ENVIRONMENT }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install python-dotenv # Added to ensure the indexer script runs
        
    - name: 1. Run Call Processing Script
      run: |
        echo "Starting call processing to update Google Sheet..."
        python main.py
        echo "Call processing completed."
        
    - name: 2. Run Pinecone Indexing Script
      run: |
        echo "Starting Pinecone indexing for new rows..."
        python index_data.py
        echo "Pinecone indexing completed."
        
    - name: Report final status
      if: always()
      run: |
        echo "Workflow completed with status: ${{ job.status }}"

