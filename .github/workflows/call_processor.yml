name: CX Insights - Process Calls and Update Index
on:
  schedule:
    - cron: '*/15 * * * *'  # Run every 15 minutes
  workflow_dispatch:      # Allow manual triggering

jobs:
  process-and-index:
    runs-on: ubuntu-latest
    
    env:
      # Call processing secrets
      EXOTEL_ACCOUNT_SID: ${{ secrets.EXOTEL_ACCOUNT_SID }}
      EXOTEL_API_KEY: ${{ secrets.EXOTEL_API_KEY }}
      EXOTEL_API_TOKEN: ${{ secrets.EXOTEL_API_TOKEN }}
      ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      
      # Indexing secrets
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      PINECONE_ENVIRONMENT: ${{ secrets.PINECONE_ENVIRONMENT }}
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install python-dotenv
        
    - name: 1. Run Call Processing Script
      run: |
        echo "================================"
        echo "Starting call processing..."
        echo "================================"
        python main.py
        echo "✅ Call processing completed"
        
    - name: 2. Run Enhanced Pinecone Indexing
      run: |
        echo "================================"
        echo "Starting enhanced indexing with aggregates..."
        echo "================================"
        python index_data.py
        echo "✅ Indexing completed"
        
    - name: Report Status
      if: always()
      run: |
        echo "================================"
        echo "Workflow Status: ${{ job.status }}"
        echo "Timestamp: $(date)"
        echo "================================"
